name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build || true
      - name: Run service-free package tests
        run: >
          pnpm --filter casbin-file-adapter
          --filter @casbin/expression-eval
          --filter session-role-manager
          --filter casbin-express-authz
          --filter koa-authz
          --filter nest-authz
          --filter @casbin/hapi-authz
          --filter egg-authz
          --filter typeorm-adapter
          --filter drizzle-adapter
          --no-bail test

  test-services:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: casbin
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: casbin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build || true
      - name: Start Redis cluster (redis-watcher cluster tests use port 7000)
        run: |
          docker run -d --name redis-cluster -p 7000-7005:7000-7005 grokzen/redis-cluster:7.0
          for i in $(seq 1 30); do
            docker exec redis-cluster redis-cli -p 7000 ping >/dev/null 2>&1 && break || sleep 2
          done
      - name: Run redis/mysql dependent package tests
        run: >
          pnpm --filter casbin-redis-adapter
          --filter @casbin/redis-watcher
          --filter casbin-basic-adapter
          --filter casbin-sequelize-adapter
          --no-bail test
