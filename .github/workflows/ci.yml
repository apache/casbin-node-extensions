name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build || true
      - name: Run service-free package tests
        run: >
          pnpm --filter casbin-file-adapter
          --filter @casbin/expression-eval
          --filter session-role-manager
          --filter casbin-express-authz
          --filter koa-authz
          --filter nest-authz
          --filter @casbin/hapi-authz
          --filter egg-authz
          --filter typeorm-adapter
          --filter drizzle-adapter
          --no-bail test

  test-services:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Passw0rd"
        ports: ["1433:1433"]
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: casbin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare pnpm@10.31.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" --filter "!casbin-prisma-adapter" --no-bail build || true
      - name: Start MySQL (native auth plugin for legacy mysql@2 client)
        run: |
          docker run -d --name mysql8 -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=casbin \
            mysql:8 --default-authentication-plugin=mysql_native_password
          for i in $(seq 1 60); do
            docker exec mysql8 mysqladmin ping -proot >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mysql8 mysql -uroot -proot -e "SELECT VERSION();"
      - name: Start Redis cluster (redis-watcher cluster tests use port 7000)
        run: |
          docker run -d --name redis-cluster -p 7000-7005:7000-7005 grokzen/redis-cluster:7.2.5
          for i in $(seq 1 45); do
            state=$(docker exec redis-cluster redis-cli -p 7000 cluster info 2>/dev/null | grep cluster_state || true)
            echo "$state" | grep -q "cluster_state:ok" && break
            sleep 2
          done
          docker exec redis-cluster redis-cli -p 7000 cluster info | grep cluster_state
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 45); do
            timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null && break
            sleep 2
          done
          sleep 5
      - name: Run redis/mysql/pg/mssql dependent package tests
        run: >
          pnpm --filter casbin-redis-adapter
          --filter @casbin/redis-watcher
          --filter casbin-basic-adapter
          --filter casbin-sequelize-adapter
          --no-bail test
